<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <!-- ID card -->
  <rect x="2" y="5" width="16" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <!-- photo area -->
  <rect x="4.5" y="8" width="4" height="4.5" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- text lines -->
  <line x1="10.5" y1="9" x2="15.5" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10.5" y1="11.5" x2="14" y2="11.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="4.5" y1="15" x2="11" y2="15" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- checkmark -->
  <circle cx="18" cy="6" r="4" fill="currentColor" opacity="0.9"/>
  <polyline points="16,6 17.5,7.5 20,4.5" fill="none" stroke="var(--s-bg, #1a1a20)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
