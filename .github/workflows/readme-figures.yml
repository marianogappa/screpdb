name: readme-figures

# Refreshes the two measured README figures (test coverage and replay-load
# throughput) after a merge to main.
#
# Why a PR and not a direct push: branch protection on main requires a `test`
# status check, and the bot is not a bypass actor, so a direct push is rejected
# exactly when a figure actually changes. The previous per-workflow push steps
# were `continue-on-error: true`, so they failed silently and both figures went
# stale. This opens (or updates) a single auto-merging PR instead, mirroring the
# Scoop-manifest bump in release.yml.
#
# Both figures are computed in one job so a merge produces at most one PR.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-figures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Don't react to our own merged refresh PR.
    if: "!startsWith(github.event.head_commit.message, 'chore(readme):')"
    env:
      CORPUS_DIR: internal/patterns/markers/testdata/replays
      BENCH_COUNT: "3"
      # Minimum relative change before the throughput figure is rewritten. The
      # runner varies by ±10-20% run to run; without a threshold each refresh PR
      # would merge, retrigger this workflow, measure a slightly different value
      # and open another one, forever.
      BENCH_MIN_DELTA: "0.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: internal/dashboard/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go test ./... compiles the dashboard package, which //go:embed's
      # frontend/build — so the UI must exist before coverage runs.
      - name: Build embedded UI
        run: make ui-build

      - name: Refresh coverage badge
        run: |
          pct="$(./scripts/coverage.sh --percent)"
          echo "coverage: $pct%"
          ./scripts/update-readme-coverage.sh "$pct"

      - name: Refresh replay-load figure
        run: |
          ./scripts/bench-load.sh "$BENCH_COUNT" | tee bench.log
          line="$(grep '^load-bench-summary:' bench.log || true)"
          if [ -z "$line" ]; then
            echo "::warning::could not parse load-bench-summary; leaving the throughput figure alone"
            exit 0
          fi
          rps="$(echo "$line"  | sed -n 's/.*replays_per_sec=\([^ ]*\).*/\1/p')"
          mspr="$(echo "$line" | sed -n 's/.*ms_per_replay=\([^ ]*\).*/\1/p')"
          corpus="$(echo "$line" | sed -n 's/.*corpus_replays=\([^ ]*\).*/\1/p')"
          old="$(grep -oE 'replay%20load-[0-9.]+' README.md | grep -oE '[0-9.]+$' || echo 0)"
          echo "measured ${rps} replays/sec; README shows ${old}"
          if awk "BEGIN{o=$old; n=$rps; if (o<=0) exit 0; d=(n>o?n-o:o-n)/o; exit !(d>=$BENCH_MIN_DELTA)}"; then
            ./scripts/update-readme-bench.sh "$rps" "$mspr" "$corpus"
          else
            echo "within $BENCH_MIN_DELTA of the published figure; treating as runner noise"
          fi

      # A PR opened by the default GITHUB_TOKEN has its checks gated as
      # `action_required` (needs a manual "Approve workflows to run" click),
      # which stalls auto-merge. A PR opened by a GitHub App is a trusted actor,
      # so its checks run automatically. Best-effort: without the SCOOP_APP_*
      # secrets this falls back to the default token (approval-gated) rather
      # than failing.
      - name: Generate app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SCOOP_APP_ID }}
          private-key: ${{ secrets.SCOOP_APP_PRIVATE_KEY }}

      - name: Open or update the refresh PR
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README figures unchanged; nothing to do."
            exit 0
          fi
          git diff -- README.md
          BRANCH="chore/readme-figures"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "chore(readme): refresh coverage and replay-load figures"
          # `-c http.extraheader=` drops the default token's persisted auth so
          # the App token in the URL is the one that is used.
          if [ -n "${APP_TOKEN:-}" ]; then
            git -c http.extraheader= push --force-with-lease \
              "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          else
            echo "::warning::SCOOP_APP_* secrets not set; pushing with the default token — the PR's checks will need manual approval."
            git push --force-with-lease origin "$BRANCH"
          fi
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR for $BRANCH already open; updated in place."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(readme): refresh coverage and replay-load figures" \
              --body "Automated refresh of the measured README figures (test coverage and replay-load throughput) from the latest main."
          fi
          gh pr merge "$BRANCH" --auto --squash || echo "::warning::Could not enable auto-merge; merge the figures PR manually."
