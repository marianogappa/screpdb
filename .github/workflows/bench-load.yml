name: bench-load

# Tracks replay-library load throughput over the fixed committed replay corpus:
# the path a user waits for on launch, and the figure behind the README badge.
# On pull requests it runs the benchmark against the PR and against the base
# branch on the same runner and comments an informational benchstat delta (never
# fails the build — GitHub runners are too variable to hard-gate). The README
# badge itself is refreshed by readme-figures.yml on push to main.
on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  bench-load:
    runs-on: ubuntu-latest
    env:
      # Fixed, reproducible corpus. The loader collapses duplicate-checksum
      # files, so the effective replay count is reported in the
      # s/load_<N>replays metric.
      CORPUS_DIR: internal/patterns/markers/testdata/replays
      BENCH_COUNT: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run load benchmark (this ref)
        run: BENCH_OUT=bench-current.txt ./scripts/bench-load.sh "$BENCH_COUNT" | tee bench-current.log

      - name: Benchmark base branch (best-effort)
        id: baseline
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}"
          git worktree add ../base-ref "origin/${{ github.base_ref }}"
          cd ../base-ref
          # Point at the PR's corpus so both runs read identical input and only
          # the code differs. A base branch that predates this benchmark will
          # fail here — that's fine, it's best-effort.
          SCREPDB_BENCH_CORPUS="$GITHUB_WORKSPACE/$CORPUS_DIR" \
            go test ./internal/library/load/ -run '^$' -bench '^BenchmarkLibraryLoadCorpus$' \
            -benchmem -benchtime=1x -count="$BENCH_COUNT" | tee "$GITHUB_WORKSPACE/bench-base.txt"

      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          if [ -s bench-base.txt ] && grep -q 's/replay' bench-base.txt; then
            "$(go env GOPATH)/bin/benchstat" bench-base.txt bench-current.txt > benchstat.txt || true
            {
              echo "### 📊 Replay load benchmark (base → PR)"
              echo
              echo "Corpus: \`$CORPUS_DIR\` · $BENCH_COUNT samples · GitHub-hosted 2-core runner. Informational only — runner variance is ±10–20%, so a small delta is noise."
              echo
              echo '```'
              cat benchstat.txt
              echo '```'
            } > comment.md
          else
            {
              echo "### 📊 Replay load benchmark"
              echo
              echo "No comparable base-branch baseline (the base predates this benchmark). Current run:"
              echo
              echo '```'
              grep '^load-bench-summary:' bench-current.log || tail -n 3 bench-current.log
              echo '```'
            } > comment.md
          fi

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- load-bench-comment -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
