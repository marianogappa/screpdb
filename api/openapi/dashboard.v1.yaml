openapi: 3.0.3
info:
  title: screpdb Dashboard API
  version: 1.0.0
paths:
  /api/custom/ingest:
    post:
      operationId: ingest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/ingest/settings:
    get:
      operationId: getIngestSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
    put:
      operationId: updateIngestSettings
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngestSettingsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/ingest/logs:
    get:
      operationId: ingestLogs
      responses:
        "101":
          description: Switching protocols for websocket upgrade
  /api/custom/game-assets/unit:
    get:
      operationId: gameAssetUnit
      tags: [operational]
      summary: PNG icon for a unit by name. Served by a hand-written handler (not generated).
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /api/custom/game-assets/building:
    get:
      operationId: gameAssetBuilding
      tags: [operational]
      summary: PNG icon for a building by name. Served by a hand-written handler (not generated).
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /api/custom/game-assets/map:
    get:
      operationId: gameAssetMap
      tags: [operational]
      summary: Rendered map preview PNG for a replay. Served by a hand-written handler (not generated).
      parameters:
        - name: replay_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /api/custom/debug/map-layout/{replayID}:
    get:
      operationId: debugMapLayout
      tags: [operational]
      summary: Debug map-layout dump for a replay. Served by a hand-written handler (not generated).
      parameters:
        - name: replayID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/markers/definitions:
    get:
      operationId: markersDefinitions
      tags: [operational]
      summary: Marker and game-event definitions (labels, icons, algorithm version). Served by a hand-written handler (not generated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/sample-set/load:
    post:
      operationId: loadSampleSet
      tags: [operational]
      summary: Queue ingestion of the bundled sample replay set. Served by a hand-written handler (not generated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/bnet/status:
    get:
      operationId: bnetStatus
      tags: [operational]
      summary: SC:R Battle.net bridge connection status. Served by a hand-written handler (not generated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/bnet/toggle:
    post:
      operationId: bnetToggle
      tags: [operational]
      summary: Enable or disable the SC:R bridge monitor. Served by a hand-written handler (not generated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericValue"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/bnet/profile:
    get:
      operationId: bnetProfile
      tags: [operational]
      summary: Cached SC:R aurora profile for one (toon, gateway); fetches through the rate-limited bridge on cache miss. Served by a hand-written handler (not generated).
      parameters:
        - name: toon
          in: query
          required: true
          schema:
            type: string
        - name: gateway
          in: query
          required: true
          schema:
            type: integer
        - name: max_age_seconds
          in: query
          required: false
          description: Serve the cached profile only if younger than this (floored at 60s, capped at the default 86400s). For following a live play session.
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/update/status:
    get:
      operationId: updateStatus
      tags: [operational]
      summary: Self-update availability check. Served by a hand-written handler (not generated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/update/apply:
    post:
      operationId: updateApply
      tags: [operational]
      summary: Apply a pending self-update and restart. Served by a hand-written handler (not generated).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/replays/stale-count:
    get:
      operationId: getStaleReplaysCount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/global-replay-filter:
    get:
      operationId: getGlobalReplayFilterConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
    put:
      operationId: updateGlobalReplayFilterConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGlobalReplayFilterConfigRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/custom/global-replay-filter/options:
    get:
      operationId: getGlobalReplayFilterOptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/games:
    get:
      operationId: gamesList
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: player
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: map
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: duration
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: featuring
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: matchup
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: map_kind
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/games/{replayID}:
    parameters:
      - $ref: "#/components/parameters/replayID"
    get:
      operationId: gameDetail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/games/{replayID}/see:
    parameters:
      - $ref: "#/components/parameters/replayID"
    post:
      operationId: gameSee
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players:
    get:
      operationId: playersList
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: only_5_plus
          in: query
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [name, race, games, apm, last_played]
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: last_played
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/insights/apm-histogram:
    get:
      operationId: playersApmHistogram
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/insights/unit-production-cadence:
    get:
      operationId: playersUnitCadence
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: min_games
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/insights/viewport-multitasking:
    get:
      operationId: playersViewportMultitasking
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerDetail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/recent-games:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerRecentGames
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/chat-summary:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerChatSummary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/insight:
    parameters:
      - $ref: "#/components/parameters/playerKey"
      - name: type
        in: query
        required: false
        schema:
          type: string
    get:
      operationId: playerInsight
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/summary/per-matchup:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerSummaryPerMatchup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/summary/special:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerSummarySpecial
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/summary/outliers:
    parameters:
      - $ref: "#/components/parameters/playerKey"
      - name: category
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: playerSummaryOutliers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/outliers:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerOutliers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/insights/apm-histogram:
    parameters:
      - $ref: "#/components/parameters/playerKey"
    get:
      operationId: playerApmHistogram
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/players/{playerKey}/insights/unit-production-cadence:
    parameters:
      - $ref: "#/components/parameters/playerKey"
      - name: filter
        in: query
        required: false
        schema:
          type: string
    get:
      operationId: playerUnitCadence
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/player-colors:
    get:
      operationId: playerColors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/screp-colors:
    get:
      operationId: screpColors
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
  /api/health:
    get:
      operationId: healthcheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericValue"
components:
  parameters:
    replayID:
      name: replayID
      in: path
      required: true
      schema:
        type: integer
        format: int64
    playerKey:
      name: playerKey
      in: path
      required: true
      schema:
        type: string
  schemas:
    IngestRequest:
      type: object
      additionalProperties: false
      properties:
        input_dir:
          type: string
        sqlite_path:
          type: string
        store_right_clicks:
          type: boolean
        stop_after_n_reps:
          type: integer
        up_to_yyyy_mm_dd:
          type: string
        up_to_n_months:
          type: integer
        clean:
          type: boolean
        clean_dashboard:
          type: boolean
    UpdateIngestSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        input_dir:
          type: string
    UpdateGlobalReplayFilterConfigRequest:
      type: object
      additionalProperties: false
      required:
        - game_types
        - exclude_short_games
        - exclude_computers
        - map_kinds
      properties:
        game_types:
          type: array
          items:
            type: string
            enum: [top_vs_bottom, melee, one_on_one, free_for_all]
        exclude_short_games:
          type: boolean
        exclude_computers:
          type: boolean
        map_kinds:
          type: array
          description: |
            Map types to include. UMS replays are always excluded globally
            (auto-discarded at ingest), so 'ums' is not a valid value here.
          items:
            type: string
            enum: [regular, money]
        compiled_replays_filter_sql:
          type: string
          nullable: true
    GenericObject:
      type: object
      additionalProperties: true
    GenericValue:
      oneOf:
        - $ref: "#/components/schemas/GenericObject"
        - type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/GenericObject"
              - type: string
              - type: number
              - type: integer
              - type: boolean
        - type: string
        - type: number
        - type: integer
        - type: boolean
